name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test
        run: npm test

      # rhysd/actionlint ships no GitHub Action. Its documented download script is pinned
      # by commit sha (v1.7.12) and installs the pinned release binary.
      - name: Install actionlint
        run: |
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/download-actionlint.bash" \
            https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash
          bash "$RUNNER_TEMP/download-actionlint.bash" 1.7.12 "$RUNNER_TEMP"

      # nullglob: templates/workflows/ may be empty or absent.
      - name: Lint workflows
        run: |
          shopt -s globstar nullglob
          "$RUNNER_TEMP/actionlint" -color templates/workflows/**/*.yml .github/workflows/*.yml
