name: review-verdict

# Passes only when a login listed in the repository variable REVIEWER_LOGINS has posted an
# unedited approve verdict for the PR's head sha, or for an earlier sha whose content
# against the base is identical (a base-only merge or a rebase keeps its approve). The
# result is a commit STATUS named `review-verdict` on the head sha, because a comment that
# lands later must be able to re-evaluate it; the ruleset requires that status context.
#
# The only trigger is a verdict comment. A new head carries no status at all until the
# reviewer posts for it, and GitHub blocks the merge on a required status that was never
# reported ("Expected"), so no run is spent painting a head yellow: a run per PR push used
# to cost a billed minute each and decided nothing. The job's `if:` skips every comment
# that is not a verdict, and a skipped job bills no minutes.
#
# The job reports failure only through the status, never through its own exit code, so a
# failed evaluation does not show up twice. The job is named `evaluate`, NOT
# `review-verdict`: a check run with the status's name would always be green and could
# satisfy a required check of that name in place of the status.
#
# The workflow file and the script run from the default branch, never from the PR: this job
# holds a token that can set statuses, and it executes no PR code. The PR head is fetched
# as git data for patch-ids only. Edited comments are ignored by the script, so `edited`
# and `deleted` events re-evaluate.
#
# "Identical content" is `git diff --full-index <merge-base> <sha> | git patch-id --verbatim`.
# Never `--stable` or `--unstable`: both strip whitespace, and whitespace carries meaning
# (shell arguments, YAML nesting, indentation-sensitive languages), so a whitespace-only
# change would inherit an approve. `--verbatim` keeps the id across a base-only merge or a
# rebase, because the diff against the merge base does not change. The pipeline is probed
# in .agents/scripts/review-verdict/verdict.test.mjs, which also pins this line.

on:
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  evaluate:
    # Only a comment whose body starts with `Reviewed-by:` can change the result, because the
    # script reads nothing else. Created: the body. Deleted: the body it had, so a removed
    # approve re-evaluates (the head must not keep `success`) and a removed chat comment does
    # not. Edited: the new body, or the old one (`changes.body.from`), so an edit that turns a
    # verdict into something else, or something else into a verdict, re-evaluates. startsWith
    # is case-insensitive here, a harmless superset of the script's own case-sensitive
    # grammar. Comments on plain issues are not ours.
    if: >-
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, 'Reviewed-by:') ||
      startsWith(github.event.changes.body.from, 'Reviewed-by:'))
    # The group lives on the job, not the workflow: a workflow-level group is taken before the
    # `if` is read, so a plain comment would cancel a running evaluation and then skip itself.
    concurrency:
      group: review-verdict-${{ github.event.issue.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # The default branch's .nvmrc, the same Node the project runs; never a pinned major.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Evaluate the verdict and set the status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REVIEWER_LOGINS: ${{ vars.REVIEWER_LOGINS }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/review-verdict"
          mkdir -p "$work"

          head_sha=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha)
          base_ref=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .base.ref)

          posted=0
          post_status() {
            gh api -X POST "repos/$REPO/statuses/$head_sha" \
              -f state="$1" -f context=review-verdict -f description="${2:0:140}" > /dev/null
            posted=1
          }

          # Any way out of the step without a posted status (a failed command, an unset
          # variable, a cancellation) posts failure, so a head that already carries `success`
          # cannot keep it. `posted` is set first, so a failing post cannot loop.
          on_exit() {
            rc=$?
            if [ "$posted" -eq 0 ]; then
              posted=1
              post_status failure "evaluation failed" || true
            fi
            exit "$rc"
          }
          trap on_exit EXIT

          if [ -z "$REVIEWER_LOGINS" ]; then
            post_status failure "repository variable REVIEWER_LOGINS is not set"
            exit 0
          fi

          # One JSON array of {login, body, createdAt}. pipefail: a failed later page must
          # fail the step (and so post failure), never pass a truncated list.
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | {login: .user.login, body: .body, createdAt: .created_at, updatedAt: .updated_at}' \
            | jq -s . > "$work/comments.json"

          git fetch --quiet origin "$base_ref" "pull/$PR_NUMBER/head"

          # Shas named in the reviewer's own comments, plus the head.
          reviewers_json=$(printf '%s' "$REVIEWER_LOGINS" | jq -R 'split(",") | map(gsub("^\\s+|\\s+$"; "") | ascii_downcase)')
          named=$(jq -r --argjson r "$reviewers_json" '
              .[]
              | select((.login | ascii_downcase) as $l | $r | index($l))
              | .body | split("\n")[0]
              | capture("^Reviewed-by: claude/[^ ,]+, head (?<sha>[^ ,\\r]+)")
              | .sha' "$work/comments.json" | sort -u)

          printf '{}' > "$work/patch-ids.json"
          add_patch_id() {
            sha="$1"
            case "$sha" in *[!0-9a-f]* | "") return 0 ;; esac
            [ "${#sha}" -ge 7 ] || return 0
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --quiet origin "$sha" 2>/dev/null || true
            git cat-file -e "$sha^{commit}" 2>/dev/null || return 0
            merge_base=$(git merge-base "origin/$base_ref" "$sha" 2>/dev/null) || return 0
            id=$(git diff --full-index "$merge_base" "$sha" | git patch-id --verbatim | cut -d' ' -f1) || return 0
            [ -n "$id" ] || return 0
            jq --arg sha "$sha" --arg id "$id" '.[$sha] = $id' "$work/patch-ids.json" > "$work/patch-ids.tmp"
            mv "$work/patch-ids.tmp" "$work/patch-ids.json"
          }
          add_patch_id "$head_sha"
          for sha in $named; do add_patch_id "$sha"; done

          set +e
          result=$(node .agents/scripts/review-verdict/verdict.mjs \
            --head "$head_sha" --reviewers "$REVIEWER_LOGINS" \
            --comments "$work/comments.json" --patch-ids "$work/patch-ids.json")
          code=$?
          set -e

          reason=$(printf '%s' "$result" | jq -r '.reason // "evaluation failed"' 2>/dev/null || echo "evaluation failed")
          state=$(printf '%s' "$result" | jq -r '.state // ""' 2>/dev/null || echo "")
          echo "$result"
          # No verdict yet is the reviewer still working, not a failure: pending shows yellow
          # and blocks a merge exactly as failure does. Red is for a blocker or an error.
          if [ "$code" -eq 0 ]; then
            post_status success "$reason"
          elif [ "$state" = none ]; then
            post_status pending "$reason; waiting for the reviewer"
          else
            post_status failure "$reason"
          fi
