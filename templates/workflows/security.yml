name: Security

# Secret scanning on every PR. A leaked credential is the one irreversible failure class in
# a repository, and an agent review can miss a pasted key.
#
# PR-only on purpose: the action scans the PR's commits, so every commit is scanned before
# it lands, and a trunk-push trigger would only re-scan content already cleared. No path
# filter either (unlike ci.yml): secrets land in markdown too.
#
# History that predates this workflow is not re-scanned on every run; sweep it once at
# adoption. If gitleaks flags a false positive, allowlist it in a committed .gitleaks.toml
# with a justification comment, never by deleting this job.

on:
  pull_request:

# The action lists the PR's commits through the API and fails with a 403 without
# pull-requests read.
permissions:
  contents: read
  pull-requests: read

jobs:
  # The job id is the status context the ruleset requires: `security`.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: an old leak is as live as a new one until it is rotated.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
