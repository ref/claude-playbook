name: pr-hygiene

# Machine-enforces the shape of a PR: a conventional-commit title (it becomes the squash
# title on the default branch), exactly one issue link, the template sections present, and
# the sections the human relies on filled. The rules live in
# .agents/scripts/pr-hygiene/hygiene.mjs and its tests; Dependabot PRs are checked for the
# title only.
#
# A separate workflow from ci.yml on purpose: it must re-run on `edited` (the body gets
# fixed without a new commit), and that must not re-run the heavy suite.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The script is always the default branch's, never the PR's own.
      - name: Check out the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the title and body
        env:
          # Untrusted input: read through the environment, never interpolated.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_TITLE" > "$RUNNER_TEMP/pr-title.txt"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          node .agents/scripts/pr-hygiene/hygiene.mjs \
            --title-file "$RUNNER_TEMP/pr-title.txt" --body-file "$RUNNER_TEMP/pr-body.md"
