# Dependabot version updates: grouped, low-noise PRs. Security updates (CVE patches) are
# enabled separately in the repository settings and bypass the cooldowns below by design:
# a known-exploited CVE is a bigger risk than a fresh release.
#
# Cooldowns are a supply-chain measure, not a noise measure: nearly every malicious npm
# release is detected and pulled within 24-72 hours, so a mandatory wait skips that window.
# Configured explicitly rather than inherited, because platform defaults change silently
# and this file is the documented policy. The local half of the same policy is pnpm's
# minimum-release-age setting (see the RUNBOOK's "Dependency cooldowns").
#
# A repository that builds its own image, or has manifests in other ecosystems, adds those
# entries in the same shape.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies
    groups:
      # One PR per week for all non-major bumps. Majors arrive one by one.
      npm-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      semver-major-days: 14
      semver-minor-days: 3
      semver-patch-days: 3
    labels:
      - dependencies
      - github-actions
    groups:
      actions-all:
        update-types:
          - minor
          - patch
